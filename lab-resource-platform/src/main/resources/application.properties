spring.config.import=optional:file:./.env[.properties]

spring.application.name=lab-resource-platform

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/labdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=lab-resource-group
spring.kafka.consumer.auto-offset-reset=earliest

# AWS S3 Configuration
app.aws.s3.bucket-name=lab-resource-platform-2026-kc740
app.aws.region=ap-southeast-2


# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=45173266081-4oi28bk6mum75rljmtg6so6ih90r4c7g.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend reset URL
app.frontend-url=http://localhost:5173

# Usage Cost Configuration
app.usage.internal-hourly-rate=500.00

app.fiscal-year.start-month=1

app.billing.default-tax-rate=0.00
app.billing.default-due-days=30


app.msg91.enabled=${MSG91_ENABLED:false}
app.msg91.authkey=${MSG91_AUTHKEY:}
app.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.msg91.country-code=91

app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.service-account=${GOOGLE_APPLICATION_CREDENTIALS:}